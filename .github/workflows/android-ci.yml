name: Android-Action-Runner

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Android-Tester-Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          
      - name: Install libraries for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-6 libxrandr2 libxrender1 libxcursor1 libxinerama1 libxi6 libglu1-mesa libpng16-16 libpulse-dev libqt5widgets5 libqt5gui5 libqt5core5a
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          # default: false
          # Whether to use the cache
          cache-disabled: true        
          # sdk version
          # see https://developer.android.com/studio/releases/platforms
          sdk-version: 26
          # see https://developer.android.com/studio/releases/build-tools
          # It will always be installed.
          build-tools-version: 34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: "-gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -ram-size 4096"
          wait-for-emulator: true
          disable-animations: true
          script: ./gradlew connectedCheck --info

