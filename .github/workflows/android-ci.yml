name: Android-Apk-Tester

on: 
  pull_request:
    branches:
      - main

jobs:
  build:
    name: creating apk
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libraries for emulator
        run: |
            sudo apt-get update > /dev/null
            sudo apt-get install -y libpulse0 libx11-6 libxrandr2 libxrender1 libxcursor1 libxinerama1 libxi6 libglu1-mesa libpng16-16 libpulse-dev libqt5widgets5 libqt5gui5 libqt5core5a qemu-kvm libvirt-daemon-system bridge-utils virt-manager udev > /dev/null
    
      - name: Enable KVM group perms
        run: |
          sudo mkdir -p /etc/udev/rules.d  # Zorg ervoor dat de directory bestaat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          # Optioneel: probeer het herladen van regels als u een lokale omgeving heeft die dit ondersteunt
          sudo udevadm control --reload-rules || echo "udevadm not found or unable to reload rules"
          sudo udevadm trigger --name-match=kvm || echo "udevadm not found or unable to trigger rules"      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          # default: false
          # Whether to use the cache
          cache-disabled: true        
          # sdk version
          # see https://developer.android.com/studio/releases/platforms
          sdk-version: 26
          # see https://developer.android.com/studio/releases/build-tools
          # It will always be installed.
          build-tools-version: 34.0.0

      # - name: Install Latest Android Command-Line Tools
      #   run: |
      #     mkdir -p $HOME/.android/cmdline-tools
      #     curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip  > /dev/null
      #     unzip cmdline-tools.zip -d $HOME/.android/cmdline-tools > /dev/null
      #     mv $HOME/.android/cmdline-tools/cmdline-tools $HOME/.android/cmdline-tools/latest
      #     rm cmdline-tools.zip  > /dev/null
      #     echo "export ANDROID_SDK_ROOT=$HOME/.android" >> $GITHUB_ENV
      #     echo "export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: List APK files
        run: ls -R ./app/build/outputs/
        
      - name: Run unit tests
        run: ./gradlew test
        
      # Update SDK Tools to resolve XML version issue
      - name: Update SDK tools
        run: |
          sdkmanager --update > /dev/null 2>&1
          sdkmanager --install 'platform-tools' 'build-tools;34.0.0' 'emulator' 'system-images;android-26;default;x86' > /dev/null 2>&1

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./gradlew connectedCheck      
                
      - name: Check test result
        if: ${{ failure() }}
        run: echo "Tests failed, please check the logs."

      