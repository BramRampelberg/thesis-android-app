name: Android-Action-Runner

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Android-Tester-Apk
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libraries for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-6 libxrandr2 libxrender1 libxcursor1 libxinerama1 libxi6 libglu1-mesa libpng16-16

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'adopt'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 26  # Installeer Android 26
          build-tools: 34.0.0  # Specificeer de versie van build-tools
          cache: true  # Dit zorgt ervoor dat de SDK wordt gecached voor sneller gebruik in volgende runs

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048"
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: true
          timeout: 1800  # 30 minuten timeout
          script: |
            ./gradlew connectedCheck --info # Voeg info vlag toe voor gedetailleerde logs

