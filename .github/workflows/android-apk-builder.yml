name: Android Builder

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Building-Apk  
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: amyu/setup-android@v4
      with:
        sdk-version: 26
        build-tools-version: 34.0.0        

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: List files in the build output directory
      run: ls -R app/build/outputs/apk/debug/  # Confirm APK exists at this path

    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV  # Creates a timestamp variable

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        # Combine branch name and sanitized timestamp (using only valid characters)
        tag_name: ${{ github.ref_name }}-${{ env.timestamp }}  # Branch name and timestamp as tag
        release_name: BuildApk:DebugRelease ${{ github.ref_name }}-${{ env.timestamp }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.APKBUILDER }}

    - name: Upload Release APK
      id: upload_release_asset
      uses: actions/upload-release-asset@v1.0.1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/debug/app-debug.apk  # Directly use the APK file
        asset_name: buut-debug-${{ env.timestamp }}.apk  # Include timestamp in the asset name
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.APKBUILDER }}
